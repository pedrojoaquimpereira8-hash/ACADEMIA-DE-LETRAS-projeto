<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACADEMIA-LETRAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="container-fluid containerQ2">
        <nav class="navbar navbarQ2 navbar-expand bg-body-tertiary">
            <a class="navbar-brand" href="#">logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav navbarQ2 me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Cursos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Professores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Contato</a>
                    </li>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Pesquisar</button>
                    </form>
                </ul>
            </div>
        </nav>
        <section class="container py-5">

            <div class="text-center mb-5">
                <h2>Consulta de Notas</h2>

                <p class="text-muted">
                    Selecione o curso e a turma para consultar as notas dos alunos.
                </p>
            </div>
            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <div class="row g-3 align-items-end">

                        <div class="col-md-5">

                            <label for="curso" class="form-label">
                                Curso
                            </label>

                            <select id="curso" class="form-select">

                                <option selected>
                                    Selecione um curso
                                </option>

                                <option value="ingles">
                                    Inglês
                                </option>

                                <option value="espanhol">
                                    Espanhol
                                </option>

                                <option value="japones">
                                    Japonês
                                </option>
                                <option value="frances">
                                    Francês
                                </option>

                            </select>

                        </div>
                        <div class="col-md-4">

                            <label for="turma" class="form-label">
                                Turma
                            </label>

                            <select id="turma" class="form-select">

                                <option selected>
                                    Selecione uma turma
                                </option>

                                <option value="A">
                                    Turma A
                                </option>

                                <option value="B">
                                    Turma B
                                </option>

                                <option value="C">
                                    Turma C
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="button" class="btn btn-primary w-100" id="btnConsultar">
                                Consultar notas
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="resultadoNotas">

                <div class="text-center text-muted py-5">

                    <p>
                        Selecione um curso e uma turma para visualizar as notas.
                    </p>

                </div>

            </div>

        </section>
        <div class="modal fade" id="modalEditarNota" tabindex="-1" aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered">

                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Editar notas</h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar">
                        </button>
                    </div>

                    <div class="modal-body">

                        <p>
                            Aluno:
                            <strong id="nomeAlunoEditar"></strong>
                        </p>

                        <div class="mb-3">
                            <label for="notaMarco" class="form-label">
                                Março
                            </label>

                            <input type="number" id="notaMarco" class="form-control" min="0" max="10" step="0.1">
                        </div>

                        <div class="mb-3">
                            <label for="notaAbril" class="form-label">
                                Abril
                            </label>

                            <input type="number" id="notaAbril" class="form-control" min="0" max="10" step="0.1">
                        </div>

                        <div class="mb-3">
                            <label for="notaMaio" class="form-label">
                                Maio
                            </label>

                            <input type="number" id="notaMaio" class="form-control" min="0" max="10" step="0.1">
                        </div>

                        <div class="mb-3">
                            <label for="notaJunho" class="form-label">
                                Junho
                            </label>

                            <input type="number" id="notaJunho" class="form-control" min="0" max="10" step="0.1">
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="button" class="btn btn-primary" id="btnSalvarNota">
                            Salvar alterações
                        </button>

                    </div>

                </div>

            </div>

        </div>
    </div>
    <script src="JS/bootstrap.js"></script>
    <script src="JS/script.js"></script>
</body>

</html>
