<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Professor - Academia Letras</title>
    <link rel="stylesheet" href="CSS/bootstrap.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Academia Letras</a>
        </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <i class="bi bi-person-badge fs-1"></i>
                <h2 class="mt-2">Login do Professor</h2>
                <p class="text-muted">Entre com seus dados para acessar o painel.</p>
            </div>

            <form id="formLoginProfessor" autocomplete="off">
                <div class="mb-3">
                    <label for="cpfProfessor" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpfProfessor" maxlength="14">
                </div>

                <div class="mb-3">
                    <label for="senhaProfessor" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senhaProfessor">
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>

                <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Voltar</a>
            </form>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-4">
        <div id="toastDonna" class="toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex align-items-center p-2">
                <i id="toastIcon" class="bi fs-3 me-3"></i>
                <div class="flex-grow-1">
                    <div id="toastTitle" class="fw-bold"></div>
                    <div id="toastBody"></div>
                </div>
                <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="JS/bootstrap.js"></script>
    <script src="JS/login.js"></script>
</body>
</html>
