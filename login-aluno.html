<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Aluno - Academia Letras</title>
    <link rel="stylesheet" href="CSS/bootstrap.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Academia Letras</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle fs-1"></i>
                            <h1 class="h3 mt-2">Área do Aluno</h1>
                            <p class="text-muted">Entre para consultar seu desempenho.</p>
                        </div>

                        <form id="formLoginAluno" autocomplete="off">
                            <div class="mb-3">
                                <label for="nomeAlunoLogin" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nomeAlunoLogin" required>
                            </div>

                            <div class="mb-3">
                                <label for="cpfAlunoLogin" class="form-label">CPF</label>
                                <input type="text" class="form-control" id="cpfAlunoLogin" maxlength="14" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-4">
        <div id="toastDonna" class="toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex align-items-center p-2">
                <i id="toastIcon" class="bi fs-3 me-3"></i>
                <div class="flex-grow-1">
                    <div id="toastTitle" class="fw-bold"></div>
                    <div id="toastBody"></div>
                </div>
                <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="JS/bootstrap.js"></script>
    <script src="JS/login-aluno.js"></script>
</body>

</html>
